name: Daily Progress Log

on:
  schedule:
    - cron: '8 10 * * 1'
    - cron: '25 16 * * 2'
    - cron: '50 9 * * 3'
    - cron: '15 14 * * 4'
    - cron: '35 11 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append to dev log
        run: |
          DATE=$(date '+%Y-%m-%d')
          DAY=$(date '+%A')
          NOTE_INDEX=$(( $(date +%j) % 10 ))

          case $NOTE_INDEX in
            0) NOTE="Reviewed PBKDF2-SHA256 iteration count — 100k is current NIST recommendation" ;;
            1) NOTE="Tested encrypt/decrypt round-trip on binary files — byte-perfect match verified" ;;
            2) NOTE="Verified random salt generation produces unique values across runs" ;;
            3) NOTE="Checked AES-256-CBC output format: [salt 8B][IV 16B][ciphertext]" ;;
            4) NOTE="Reviewed OpenSSL EVP_EncryptFinal_ex padding behavior" ;;
            5) NOTE="Tested with large file (100MB) — memory usage stays flat with chunked reads" ;;
            6) NOTE="Verified wrong password produces garbled output, not a crash" ;;
            7) NOTE="Reviewed Makefile — added clean target for build artifacts" ;;
            8) NOTE="Cross-checked key derivation against OpenSSL CLI enc -pbkdf2 output" ;;
            9) NOTE="Reviewed IV uniqueness requirement — confirmed fresh random IV per encryption" ;;
          esac

          echo "- [$DATE] ($DAY) $NOTE" >> dev_log.md
          git config --global user.name "RocmDaGr8"
          git config --global user.email "bhatta45@students.rowan.edu"
          git add dev_log.md
          git commit -m "dev log: $DATE"
          git push
